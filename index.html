<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boom Deck</title>
<style>
  :root { --cw: 84px; --ch: calc(var(--cw) * 1.45); --gold: #ffd166; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: radial-gradient(1100px 720px at 50% 42%, #3b2a63, #1a1233 70%, #0e0a1f); color: #fff; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         user-select: none; -webkit-user-select: none; touch-action: none; }
  #table { position: fixed; inset: 0; touch-action: none; }
  #table.shake { animation: quake .5s; } @keyframes quake { 15% { transform: translate(-9px, 4px); } 35% { transform: translate(8px, -6px); } 55% { transform: translate(-6px, 5px); } 75% { transform: translate(4px, -2px); } }
  /* ── cards ── */
  .card { width: var(--cw); height: calc(var(--cw) * 1.45); box-sizing: border-box; border-radius: calc(var(--cw) * .12); background: linear-gradient(160deg, var(--c1), var(--c2)); border: calc(var(--cw) * .05) solid #fff;
          box-shadow: 0 3px 9px #0008; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2%; color: #fff; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #ffffff40, #0000 55%); pointer-events: none; }
  .card .ic { font-size: calc(var(--cw) * .46); line-height: 1; filter: drop-shadow(0 2px 2px #0006); }
  .card .tt { font-weight: 900; font-size: calc(var(--cw) * .165); text-transform: uppercase; letter-spacing: .03em; text-shadow: 0 2px 0 #0005; }
  .card .tx { font-size: calc(var(--cw) * .105); opacity: .92; text-align: center; padding: 0 7%; line-height: 1.1; min-height: 2.2em; }
  .tiny .card .tx { display: none; }
  .k-B { --c1: #3a3550; --c2: #121019; } .k-B .tt { color: #ff5a5a; } .k-B { border-color: #ff5a5a; box-shadow: 0 0 18px #ff5a5a88, 0 3px 9px #0008; }
  .k-D { --c1: #39d283; --c2: #138a4e; } .k-P { --c1: #a07bff; --c2: #5a2fcc; } .k-K { --c1: #4f9dff; --c2: #1f5fd1; }
  .k-A { --c1: #ff7f4f; --c2: #d6341c; } .k-H { --c1: #2fd6cf; --c2: #12839a; } .k-T { --c1: #ffc94a; --c2: #db8400; }
  .back { --c1: #2a2f66; --c2: #141633; border-color: #ffe9b0; }
  .back::after { content: ""; position: absolute; inset: 8%; border-radius: 6px; border: 2px dashed #ffe9b055; background: radial-gradient(circle, #ff8a3d33 0 30%, #0000 31%); }
  .back .ic { font-size: calc(var(--cw) * .4); z-index: 1; } .back .tt { font-size: calc(var(--cw) * .12); color: #ffe9b0; z-index: 1; }
  /* ── seats ── */
  #opps { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 6px; padding: 0 8px; }
  .seat { width: clamp(58px, calc((100vw - 46px) / 5), 86px); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .25s, opacity .3s; position: relative; cursor: default; }
  .seat.turn { transform: translateY(6px) scale(1.08); }
  .seat.out { opacity: .4; filter: grayscale(.8); }
  .seat.target { cursor: pointer; } .seat.target .av { box-shadow: 0 0 0 3px var(--gold), 0 0 20px var(--gold); animation: bob .8s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-5px); } }
  .av { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #14161f; font-size: 18px;
        background: radial-gradient(closest-side, var(--c) 0 79%, #1a1233 80% 87%, transparent 88%), conic-gradient(var(--gold) calc(var(--t, 0) * 1turn), #ffffff1c 0); }
  .seat .nm { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .fan { position: relative; height: 36px; width: 64px; }
  .seat .fan .card { position: absolute; left: 50%; top: 2px; --cw: 22px; border-width: 1.5px; } .seat .fan .card .ic, .seat .fan .card .tt { display: none; }
  .seat .cnt { position: absolute; top: 33px; right: 2px; background: #fff; color: #111; border-radius: 10px; font-size: 12px; font-weight: 800; padding: 1px 6px; z-index: 2; }
  .seat .tag { position: absolute; top: -6px; left: -2px; border-radius: 8px; font-size: 10px; font-weight: 800; padding: 1px 5px; z-index: 2; background: #ff6b3d; }
  .seat .tag.dead { background: #000; border: 1px solid #ff5a5a; }
  /* ── the middle: the deck and the discard pile ── */
  #mid { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); display: flex; gap: calc(var(--cw) * .6); align-items: center; }
  #deck, #pile { position: relative; width: var(--cw); height: var(--ch); }
  #deck .card, #pile .card { position: absolute; left: 0; top: 0; }
  #deck { cursor: pointer; } #deck.can .card:last-of-type { box-shadow: 0 0 0 3px var(--gold), 0 0 26px var(--gold); }
  #deck.shuf .card { animation: shuf .6s; } @keyframes shuf { 30% { transform: translateX(-14px) rotate(-8deg); } 60% { transform: translateX(14px) rotate(8deg); } }
  #deck .lbl, #pile .lbl { position: absolute; bottom: -24px; left: -20px; right: -20px; text-align: center; font-size: 12px; font-weight: 700; opacity: .85; white-space: nowrap; }
  #danger { position: absolute; left: 50%; top: calc(44% + var(--ch) * .5 + 10px); transform: translateX(-50%); font-size: 13px; font-weight: 800; padding: 3px 12px; border-radius: 999px;
            background: #0007; white-space: nowrap; pointer-events: none; }
  #danger:empty { display: none; }
  #danger i { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: #ffffff22; vertical-align: 2px; margin-left: 6px; overflow: hidden; }
  #danger i b { display: block; height: 100%; background: linear-gradient(90deg, #ffd166, #ff3d3d); }
  /* ── my hand and status ── */
  #hand { position: absolute; left: 0; right: 0; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 20px); height: calc(var(--ch) + 26px); }
  #hand .card { position: absolute; bottom: 0; transition: transform .22s, left .22s, filter .2s, box-shadow .2s; cursor: pointer; transform-origin: 50% 120%; }
  #hand .card.ok { box-shadow: 0 0 0 3px var(--gold), 0 8px 18px #000a; }
  #hand .card.dim { filter: brightness(.6) saturate(.6); }
  #hand .card.new::after { content: "new"; position: absolute; top: 4%; right: 6%; background: #fff; color: #222; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 0 4px; }
  #me { position: absolute; left: 0; right: 0; bottom: calc(max(8px, env(safe-area-inset-bottom)) + var(--ch) + 52px); text-align: center; font-weight: 800; font-size: 17px; text-shadow: 0 2px 5px #000b; pointer-events: none; padding: 0 12px; }
  #me small { display: block; font-size: 12px; font-weight: 600; opacity: .85; }
  #timer { width: 150px; height: 5px; margin: 5px auto 0; border-radius: 4px; background: #ffffff22; overflow: hidden; }
  #timer i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
  #hint { position: absolute; left: 50%; top: calc(44% - var(--ch) * .5 - 44px); transform: translateX(-50%); background: #000a; padding: 7px 14px; border-radius: 999px; font-size: 13px;
          white-space: nowrap; pointer-events: none; transition: opacity .5s; z-index: 5; }
  #toast { position: absolute; left: 50%; top: calc(44% - var(--ch) * .5 - 44px); /* where the hint was: clear of the Boom meter */ transform: translateX(-50%); background: #000c; padding: 6px 14px;
           border-radius: 999px; font-size: 13px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; z-index: 6; }
  #cancel { position: absolute; left: 50%; top: calc(44% - var(--ch) * .5 - 52px); transform: translateX(-50%); min-height: 44px; padding: 0 20px; border-radius: 22px; border: 0;
            background: #ffffff26; color: #fff; font: 700 14px system-ui, sans-serif; cursor: pointer; z-index: 7; }
  #net { position: fixed; bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; pointer-events: none; }
  /* ── overlays ── */
  #peek, #place, #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0009; z-index: 30; }
  #peek[hidden], #place[hidden], #over[hidden], #cancel[hidden] { display: none; }
  .box { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; padding: 18px; border-radius: 18px; background: #1d1640; border: 1px solid #ffffff22; text-align: center; }
  .box h2 { margin: 0 0 4px; font-size: 24px; } .box p { margin: 0 0 12px; opacity: .85; }
  .box h3 { margin: 6px 0 4px; font-size: 13px; color: var(--gold); text-align: left; }
  .box li.note { list-style: none; margin-left: -24px; opacity: .8; } /* a message in place of the list: no "1." in front of it */
  .box ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; } .box li span { float: right; }
  .box button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--gold); color: #2a1d00; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  #peekCards { display: flex; justify-content: center; gap: 10px; margin: 6px 0 14px; --cw: 76px; }
  #peekCards > div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; opacity: .9; }
  #placeBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } #placeBtns button { min-height: 48px; background: #ffffff1f; color: #fff; }
  #placeBtns button:last-child { grid-column: span 2; background: var(--gold); color: #2a1d00; }
  .fly { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; transition: transform .45s cubic-bezier(.2, .8, .25, 1); }
  .pop { position: fixed; z-index: 21; pointer-events: none; font-weight: 900; font-size: 32px; text-shadow: 0 3px 0 #0008; animation: pop 1.2s ease-out forwards; white-space: nowrap; }
  @keyframes pop { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -120%) scale(1); opacity: 0; } }
  .shk { animation: shk .35s; } @keyframes shk { 25% { margin-left: -6px; } 75% { margin-left: 6px; } }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 35; }
  .attract #hint, .attract #toast, .attract #net, .attract #me { display: none; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<div id="table">
  <div id="opps"></div>
  <div id="mid"><div id="deck"></div><div id="pile"></div></div>
  <div id="danger"></div>
  <div id="hint">Play cards, then tap the deck to draw. Don't draw a 💣!</div>
  <div id="me"><span id="meText"></span><div id="timer" style="visibility: hidden"><i></i></div></div>
  <div id="toast"></div>
  <button id="cancel" hidden>Cancel</button>
  <div id="hand"></div>
</div>
<canvas id="fx"></canvas>
<div id="net">Connecting…</div>
<div id="peek" hidden><div class="box"><h2>👁️ The top 3</h2><p>Only you can see this.</p><div id="peekCards"></div><button id="peekOk">Got it</button></div></div>
<div id="place" hidden><div class="box"><h2>✂️ Defused!</h2><p>Put the Boom back in the deck. Nobody else sees where.</p>
  <div id="placeBtns"><button data-p="0">On top</button><button data-p="1">2nd from top</button><button data-p="2">3rd from top</button><button data-p="b">At the bottom</button><button data-p="r">Anywhere (random)</button></div></div></div>
<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most wins</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button id="again">Play again</button>
</div></div>
<script>
/* ═══ BOOM DECK · a Multiplayer Agent starter ═══════════════════════════════════════════
 * A party card game: the deck hides Boom cards. Play action cards, then draw one to end your
 * turn. Draw a Boom without a Defuse and you're out. Last player standing wins. 2–6 players;
 * bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ seats, hand size, deck mix, timers, the leaderboard
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED HANDS .. the Seal helper: hands, peeks and Boom placements are encrypted
 *   CARDS ......... the card types (name, icon, what it does) and the deck mix
 *   TABLE (HOST) .. dealing, playing actions, drawing, Booms, defusing, turns, seats, and
 *                   taking over as a new host. Only the host writes the shared fields.
 *   BOTS .......... what a bot plays (also used when a human's timer runs out)
 *   MY HAND ....... reading my sealed hand and peeks, playing, stealing, placing a Boom
 *   SCREEN ........ seats, deck, pile, my hand, flying cards, explosions, sounds
 *   RESULTS ....... the game-over card and the leaderboard
 *   MAIN LOOP ..... heartbeat, host tick, drawing, color fix, start
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The table lives in shared fields only the HOST writes: `game` (one JSON field: id, v, ph
 *     "play"|"defuse"|"over", host, seats, out, counts, deck, booms, turn, owed, ts, t, top, used,
 *     turnAt, turnEnds, last, winner, endsAt), `hand0`…`hand5` (each human's hand, SEALED to that
 *     player's public key) and `peek` (the top 3 cards, sealed to the player who peeked).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s). It
 *     holds the deck order and the bots' hands in its own memory.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key), `hb`.
 *   - Players send intents to the host: "play" {g, t, c, to}, "draw" {g, t}, "place" {g, t, box}
 *     (where the Boom goes, sealed to the host so nobody else learns it), "again" {g}. `t` counts
 *     every action, so an old or double intent is ignored.
 *   - When the host changes, every player re-sends its own hand sealed to the new host
 *     ("myhand" {to, r, box}). The new host rebuilds the deck from the cards nobody holds and
 *     nobody has played (the deck mix minus `used`), reshuffled; the bots get fresh hands of the
 *     same size. So a secretly placed Boom is reshuffled when the host changes.
 *   - Timers are timestamps: turnEnds (then the host draws for you, or places your Boom at
 *     random), endsAt (next game).
 *   - ?attract plays offline with bots (your seat on autopilot) for the preview video.
 *   - Leaderboard "wins": +1 for each game a player wins, shown on the game-over card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,            // bots fill the table up to this many players (2 to 6)
  handSize: 4,         // action cards dealt to each player, plus one Defuse
  actionBase: 2,       // each action card appears actionBase + players times (Attack 1 fewer, Shuffle 2 fewer)
  spareDefuses: 2,     // Defuses shuffled into the deck (6 Defuses at most in all)
  turnMs: 25000,       // time for a turn before the host draws for you
  placeMs: 12000,      // time to choose where a defused Boom goes before it goes in at random
  botMs: 1100,         // how long a bot thinks before each card
  peekMs: 4000,        // how long the top-3 peek stays open
  resultsMs: 10000,    // the game-over card shows this long, then the next game deals
  seatGraceMs: 8000,   // a player silent this long hands its seat to a bot
  rejoinMs: 3000,      // a new host waits this long for everyone to re-send their hands
  board: "wins",       // leaderboard name
};
const BOT_NAMES = ["Fuse", "Sparky", "Kaboom", "Wick", "Dyna", "Pop"];
const COLORS = ["#ff8a65", "#4fc3f7", "#ffd54f", "#81c784", "#ba68c8", "#f06292", "#4dd0e1", "#aed581"];
const NAME_A = ["Happy", "Sneaky", "Lucky", "Quick", "Jolly", "Clever"], NAME_B = ["Otter", "Panda", "Fox", "Koala", "Badger", "Moose"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'boom-deck',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
/** Still in the room and heard from within the seat grace time. */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── SEALED HANDS ────────────────────────────────────────────────────────────────────
// Everything in room state reaches every client, so a secret is written SEALED: encrypted so only
// its one reader can open it. Each player publishes a public key in its own entity (`pk`); the
// host seals each hand (and each peek) to that key and writes the box into shared state.
//   - The host deals, so the host can read every hand and knows the deck. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed, so every player re-sends its own hand
//     to the new host (sealed, with mp.send), and the new host rebuilds the deck.
//   - crypto.subtle needs https or localhost. Without it seal()/open() pass the value through.
//   - NEVER plaintext online: with no key for the recipient (a player who just joined and hasn't
//     published `pk` yet, or one who left), seal() returns "" (an empty box nobody can open).
//     Only players whose `pk` the host has get a seat; bots have no key, so the host keeps
//     their hands in its own memory.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── CARDS ───────────────────────────────────────────────────────────────────────────
// A card is one letter. Hands hold every type but Boom; the deck holds all of them.
const CARDS = {
  B: { name: "Boom", icon: "💣", text: "Draw it and you're out" },
  D: { name: "Defuse", icon: "✂️", text: "Saves you from a Boom" },
  P: { name: "Peek", icon: "👁️", text: "See the top 3 cards" },
  K: { name: "Skip", icon: "⏭️", text: "End your turn, no draw" },
  A: { name: "Attack", icon: "⚔️", text: "Next player takes 2 turns" },
  H: { name: "Shuffle", icon: "🔀", text: "Shuffle the deck" },
  T: { name: "Steal", icon: "🧲", text: "Take a random card" },

/** Where a seat is on screen (my seat = my hand). */

}
const center = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
/** A card flying across the table (an effect only; state already has the result). */
function fly(card, from, to, delay = 0, scale = 1) {

function popText(text, at, color = "#fff", size = 32) { const el = document.createElement("div"); el.className = "pop"; el.textContent = text; el.style.left = at.x + "px"; el.style.top = at.y + "px"; el.style.color = color; el.style.fontSize = size + "px"; document.body.appendChild(el); setTimeout(() => el.remove(), 1300); }
let seenT = "";
/** When an action lands in state: fly the cards, pop the action's name, blow things up, play a sound. */
function effects(g) {
  const key = g.id + ":" + g.t;
  if (key === seenT) return;
  const first = !seenT; seenT = key;
  if (first) return;
  const L = g.last || {}, deck = center($("deck")), pile = center($("pile")), mine = seatOf(g, net.sessionId);
  if (L.a === "deal") { g.seats.forEach((_, i) => { for (let k = 0; k < 3; k++) fly(null, deck, seatPoint(g, i), (k * g.seats.length + i) * 60, 0.8); }); sound("deal"); return; }
  if (L.a === "play") {
    const from = L.s === mine && flyFrom && flyFrom.card === L.c ? center({ getBoundingClientRect: () => flyFrom.rect }) : seatPoint(g, L.s);
    fly(L.c, from, pile); flyFrom = null;
    const k = CARDS[L.c], who = seatName(g.seats[L.s]);
    setTimeout(() => popText(`${k.icon} ${k.name}!`, { x: pile.x, y: pile.y - cw() }, "#fff", 28), 250);
    if (L.c === "A") setTimeout(() => popText(`${L.to === mine ? "You take" : seatName(g.seats[L.to]) + " takes"} 2 turns`, seatPoint(g, L.to), "#ff9a6b", 20), 500);
    if (L.c === "T") { fly(null, seatPoint(g, L.to), seatPoint(g, L.s), 350, 0.8); if (L.to === mine) setTimeout(() => toast(`${who} stole a card from you`), 400); }

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again.

(async function start() {
